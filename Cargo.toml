[package]
name = "blockchain-rs"
version = "0.1.0"
authors = ["Jay"]
description = "A simplified blockchain implementation in rust for learning"
edition = "2024"
readme = "README.md"
license = "MIT"
keywords = ["blockchain", "simplified"]


[dependencies]
sha2 = "0.10.9"
ed25519-dalek = "2.1"
ripemd = "0.1.1"
bincode = "1.3.3"
thiserror = "2.0.11"
anyhow = "1.0.95"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11.8"
clap = { version = "4.5.31", features = ["derive"] }
bitcoincash-addr = "0.5.2"
rand = "0.9.2"
merkle-cbt = "0.3.2"
digest = "0.10.7"
